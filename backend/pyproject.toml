[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "samixa-code-backend"
version         = "0.1.0"
description     = "Local agent backend for the VS Code coding assistant -- agent loop, tool execution, and retrieval over a workspace, talking to the model-orchestrator for chat/embeddings."
readme          = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "websockets>=12.0",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.24",
]

[project.scripts]
start = "samixa_code.main:main"

[tool.setuptools.packages.find]
where   = ["."]
include = ["samixa_code*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
